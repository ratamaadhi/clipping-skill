[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping-skill"
version = "0.1.0"
description = "Agent skill: long video -> vertical shorts with explainable clip scoring"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Jalur transkripsi lokal. Butuh Python 3.11-3.12 (ctranslate2 belum ada wheel 3.14).
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
clipping-skill = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts", "scripts.lib"]
